<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TCG Expense Tracker</title>
<style>
  :root{
    --bg:#0f1012; --bg-elevated:#17191c; --bg-card:#1d2024; --border:#2b2f34;
    --text:#f2f4f6; --text-dim:#9da4ad; --danger:#f87171; --danger-soft:rgba(248,113,113,.16);
    --warn:#facc15; --success:#4ade80; --accent-border:#45484d; --accent-glow:rgba(255,255,255,.04);
  }
  :root[data-theme="fury"]{
    --accent:#ef4444; --accent-strong:#dc2626; --accent-soft:rgba(239,68,68,.16); --accent-text:#fff;
    --accent-border:rgba(239,68,68,.42); --accent-glow:rgba(239,68,68,.08);
  }
  :root[data-theme="body"]{
    --accent:#f97316; --accent-strong:#ea580c; --accent-soft:rgba(249,115,22,.16); --accent-text:#fff;
    --accent-border:rgba(249,115,22,.42); --accent-glow:rgba(249,115,22,.08);
  }
  :root[data-theme="mind"]{
    --accent:#3b82f6; --accent-strong:#2563eb; --accent-soft:rgba(59,130,246,.16); --accent-text:#fff;
    --accent-border:rgba(59,130,246,.42); --accent-glow:rgba(59,130,246,.08);
  }
  :root[data-theme="calm"]{
    --accent:#22c55e; --accent-strong:#16a34a; --accent-soft:rgba(34,197,94,.16); --accent-text:#07130b;
    --accent-border:rgba(34,197,94,.42); --accent-glow:rgba(34,197,94,.08);
  }
  :root[data-theme="order"]{
    --accent:#eab308; --accent-strong:#ca8a04; --accent-soft:rgba(234,179,8,.16); --accent-text:#171205;
    --accent-border:rgba(234,179,8,.42); --accent-glow:rgba(234,179,8,.08);
  }
  :root[data-theme="chaos"]{
    --accent:#a78bfa; --accent-strong:#8b5cf6; --accent-soft:rgba(167,139,250,.16); --accent-text:#0c0a12;
    --accent-border:rgba(167,139,250,.42); --accent-glow:rgba(167,139,250,.08);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3 { margin:0; font-weight:700; letter-spacing:-0.01em; }
  input, select, button, textarea { font-family:inherit; }
  input, select {
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:10px 12px; font-size:0.95rem; width:100%;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  label { font-size:0.82rem; color:var(--text-dim); display:block; margin-bottom:4px; }
  button {
    cursor:pointer; border:none; border-radius:8px; padding:10px 16px;
    font-size:0.92rem; font-weight:600; transition: transform .08s ease, opacity .15s ease;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background:var(--accent-strong); color:var(--accent-text); }
  .btn-primary:hover { opacity:.9; }
  .btn-ghost { background:transparent; color:var(--text-dim); border:1px solid var(--border); }
  .btn-ghost:hover { color:var(--text); border-color:var(--accent); }
  .btn-danger { background:var(--danger-soft); color:var(--danger); }
  .btn-danger:hover { opacity:.85; }
  .btn-sm { padding:6px 10px; font-size:0.8rem; border-radius:6px; }

  /* ---------- Auth screen ---------- */
  #auth-screen {
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-box {
    width:100%; max-width:380px; background:var(--bg-card);
    border:1px solid var(--border); border-radius:16px; padding:32px 28px;
    border-top:3px solid var(--accent-border);
  }
  .auth-box h1 { font-size:1.5rem; margin-bottom:2px; }
  .auth-sub { color:var(--text-dim); font-size:0.88rem; margin-bottom:24px; }
  .auth-field { margin-bottom:14px; }
  .auth-error {
    background:var(--danger-soft); color:var(--danger); border-radius:8px;
    padding:10px 12px; font-size:0.85rem; margin-bottom:14px; display:none;
  }
  .auth-toggle {
    margin-top:16px; text-align:center; font-size:0.85rem; color:var(--text-dim);
  }
  .auth-toggle button { background:none; color:var(--accent); padding:0; font-weight:600; }

  /* ---------- App shell ---------- */
  #app-screen { display:none; max-width:960px; margin:0 auto; padding:20px 16px 60px; }
  header.topbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-bottom:20px; flex-wrap:wrap;
  }
  .brand { display:flex; align-items:baseline; gap:8px; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; }
  .brand h1 { font-size:1.2rem; }
  .topbar-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #game-select, #palette-select { width:auto; padding:8px 10px; font-size:0.82rem; }
  .user-email { font-size:0.78rem; color:var(--text-dim); }
  .view-nav { display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .nav-btn { background:transparent; color:var(--text-dim); border-radius:8px 8px 0 0; border-bottom:2px solid transparent; padding:10px 14px; }
  .nav-btn:hover { color:var(--text); }
  .nav-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
  .view { display:none; }
  .view.active { display:block; }

  .card {
    background:var(--bg-card); border:1px solid var(--accent-border); border-radius:14px;
    box-shadow:0 0 0 1px var(--accent-glow), 0 0 12px var(--accent-glow);
    padding:20px; margin-bottom:18px;
  }
  .card h2 { font-size:1rem; margin-bottom:14px; }
  .grid-form { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:12px; align-items:end; }
  .grid-form > div { min-width:0; }
  #expense-form input, #expense-form select { width:100%; min-width:0; max-width:100%; height:42px; }
  .grid-form input[type="date"] { -webkit-appearance:none; appearance:none; }
  .grid-form input[type="date"]::-webkit-calendar-picker-indicator { width:16px; height:16px; margin-left:4px; }
  .grid-form .full { grid-column: 1 / -1; }
  .grid-form .note-field { grid-column: span 3; }
  .grid-form .submit-field { grid-column: span 1; }
  .grid-form .submit-field button {
    width:100%; height:42px; padding:10px 12px; box-sizing:border-box;
    border:1px solid var(--accent-border); font-size:0.95rem;
  }
  @media (max-width:680px){
    .grid-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #expense-form input, #expense-form select { font-size:16px; }
    .grid-form .note-field, .grid-form .submit-field { grid-column: span 1; }
  }

  /* Budget */
  .budget-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .budget-input-wrap { display:flex; align-items:center; gap:8px; }
  .budget-input-wrap input { width:120px; }
  .progress-track { height:10px; border-radius:6px; background:var(--bg-elevated); overflow:hidden; border:1px solid var(--border); }
  .progress-fill { height:100%; border-radius:6px; background:var(--accent); transition: width .3s ease, background .3s ease; }
  .budget-meta { display:flex; justify-content:space-between; font-size:0.82rem; color:var(--text-dim); margin-top:6px; }
  .budget-alert {
    margin-top:10px; background:var(--danger-soft); color:var(--danger); border-radius:8px;
    padding:8px 12px; font-size:0.82rem; display:none;
  }

  /* Expenses list */
  .expense-row {
    display:grid; grid-template-columns: 90px 1fr 110px 100px; gap:10px; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:0.88rem;
  }
  .expense-row-view { grid-template-columns:90px 1fr 100px; }
  .expense-row:last-child { border-bottom:none; }
  .expense-cat { display:flex; align-items:center; gap:8px; }
  .cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .expense-note { color:var(--text-dim); font-size:0.78rem; }
  .expense-details .expense-amount { text-align:left; margin-top:4px; }
  .expense-amount { text-align:right; font-weight:700; font-variant-numeric: tabular-nums; }
  .expense-actions { display:flex; gap:6px; justify-content:flex-end; }
  .empty-state { color:var(--text-dim); font-size:0.88rem; text-align:center; padding:20px 0; }
  @media (max-width:640px){
    .expense-row { grid-template-columns: 1fr; grid-template-rows:auto auto auto; row-gap:6px; }
    .expense-amount { text-align:left; }
    .expense-actions { justify-content:flex-start; }
    .expense-row-view {
      grid-template-columns:minmax(0, 1fr) auto;
      grid-template-rows:auto auto;
      column-gap:10px;
      row-gap:6px;
      align-items:start;
    }
    .expense-row-view > :first-child { grid-column:1 / -1; }
    .expense-row-view .expense-details { grid-column:1; }
    .expense-row-view .expense-actions {
      grid-column:2;
      grid-row:2;
      align-self:center;
      justify-content:flex-end;
    }
  }

  /* Stats */
  .stats-grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  @media (max-width:720px){ .stats-grid { grid-template-columns: 1fr; } }
  .chart-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .legend { width:100%; display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:0.78rem; color:var(--text-dim); }
  .legend-item span.name { flex:1; color:var(--text); }
  .legend-item span.val { font-variant-numeric: tabular-nums; }
  canvas { max-width:100%; }
  .month-total { text-align:center; margin-top:2px; }
  .month-total .num { font-size:1.4rem; font-weight:700; }
  .month-total .lbl { font-size:0.75rem; color:var(--text-dim); }
  .stats-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .stats-heading h2 { margin-bottom:0; }
  #stats-game-filter { width:auto; min-width:160px; }
  .stat-kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px; }
  .stat-kpi { background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .stat-kpi .label { color:var(--text-dim); font-size:0.75rem; margin-bottom:5px; }
  .stat-kpi .value { font-size:1.1rem; font-weight:700; }
  .game-breakdown { margin-top:20px; border-top:1px solid var(--border); padding-top:16px; }
  .game-breakdown h3 { font-size:0.9rem; margin-bottom:10px; }
  .game-total-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
  .game-total-row:last-child { border-bottom:none; }
  .game-total-row .name { flex:1; }
  .game-total-row .amount { font-weight:700; font-variant-numeric:tabular-nums; }
  @media (max-width:600px){
    .stat-kpis { grid-template-columns:1fr; }
    .stats-heading { align-items:stretch; flex-direction:column; }
    #stats-game-filter { width:100%; }
  }

  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>
<body data-theme-root>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="auth-box">
    <h1 id="auth-title">Sign in</h1>
    <p class="auth-sub">Track your TCG expenses</p>
    <div class="auth-error" id="auth-error" role="alert"></div>
    <form id="auth-form">
      <div class="auth-field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="btn-primary" style="width:100%" id="auth-submit">Sign in</button>
    </form>
    <div class="auth-toggle">
      <span id="auth-toggle-text">Don't have an account yet?</span>
      <button type="button" id="auth-toggle-btn">Create an account</button>
    </div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>TCG Expense Tracker</h1>
    </div>
    <div class="topbar-actions">
      <select id="palette-select" aria-label="Color theme">
        <option value="fury">Fury Red</option>
        <option value="body">Body Orange</option>
        <option value="mind">Mind Blue</option>
        <option value="calm">Calm Green</option>
        <option value="order">Order Yellow</option>
        <option value="chaos">Chaos Purple</option>
      </select>
      <span class="user-email" id="user-email"></span>
      <button class="btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </div>
  </header>

  <nav class="view-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-view="expense-view">+ Add expense</button>
    <button class="nav-btn" data-view="stats-view">Statistics</button>
  </nav>

  <main id="expense-view" class="view active">
    <!-- Budget -->
    <section class="card">
      <h2>Monthly budget</h2>
      <div class="budget-row">
        <div class="budget-input-wrap">
          <label for="budget-input" class="sr-only">Monthly budget in CHF</label>
          <input type="number" id="budget-input" min="0" step="1" placeholder="0">
          <span style="color:var(--text-dim); font-size:0.85rem;">CHF</span>
          <button class="btn-primary btn-sm" id="budget-save-btn">Save</button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="budget-progress" style="width:0%"></div></div>
      <div class="budget-meta">
        <span id="budget-spent-lbl">0.00 CHF spent</span>
        <span id="budget-pct-lbl">0%</span>
      </div>
      <div class="budget-alert" id="budget-alert">Monthly budget exceeded.</div>
    </section>

    <!-- Add expense -->
    <section class="card">
      <h2>Add an expense</h2>
      <form id="expense-form" class="grid-form">
        <div>
          <label for="game-select">Game</label>
          <select id="game-select" required>
            <option value="riftbound">Riftbound</option>
            <option value="magic">Magic The Gathering</option>
            <option value="pokemon">Pokemon</option>
            <option value="lorcana">Lorcana</option>
            <option value="one-piece">One Piece</option>
            <option value="flesh-and-blood">Flesh n Blood</option>
            <option value="other">Other TCGs</option>
          </select>
        </div>
        <div>
          <label for="exp-category">Category</label>
          <select id="exp-category" required></select>
        </div>
        <div>
          <label for="exp-amount">Amount (CHF)</label>
          <input type="number" id="exp-amount" step="0.05" min="0" required>
        </div>
        <div>
          <label for="exp-date">Date</label>
          <input type="date" id="exp-date" required>
        </div>
        <div class="note-field">
          <label for="exp-note">Note (optional)</label>
          <input type="text" id="exp-note" maxlength="120" placeholder="e.g. booster box">
        </div>
        <div class="submit-field">
          <button type="submit" class="btn-primary">Add expense</button>
        </div>
      </form>
    </section>

    <!-- History -->
    <section class="card">
      <h2>Expense history <span id="expense-game-label"></span></h2>
      <div id="expenses-list"></div>
    </section>
  </main>

  <main id="stats-view" class="view">
    <section class="card">
      <div class="stats-heading">
        <h2>Statistics</h2>
        <select id="stats-game-filter" aria-label="Statistics TCG filter">
          <option value="all">All TCGs</option>
          <option value="riftbound">Riftbound</option>
          <option value="magic">Magic The Gathering</option>
          <option value="pokemon">Pokemon</option>
          <option value="lorcana">Lorcana</option>
          <option value="one-piece">One Piece</option>
          <option value="flesh-and-blood">Flesh n Blood</option>
          <option value="other">Other TCGs</option>
        </select>
      </div>
      <div class="stat-kpis">
        <div class="stat-kpi"><div class="label">This month</div><div class="value" id="stats-month-total">0.00 CHF</div></div>
        <div class="stat-kpi"><div class="label">All time</div><div class="value" id="stats-all-time-total">0.00 CHF</div></div>
        <div class="stat-kpi"><div class="label">Expenses</div><div class="value" id="stats-expense-count">0</div></div>
      </div>
      <div class="stats-grid">
        <div class="chart-wrap">
          <canvas id="chart-donut" width="220" height="220"></canvas>
          <div class="month-total" id="donut-total"></div>
          <div class="legend" id="donut-legend"></div>
        </div>
        <div class="chart-wrap">
          <canvas id="chart-bars" width="320" height="220"></canvas>
          <div style="font-size:0.75rem; color:var(--text-dim);">Last 6 months</div>
        </div>
      </div>
      <div class="game-breakdown">
        <h3>This month by TCG</h3>
        <div id="game-breakdown-list"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Config ----------
  const SUPABASE_URL = "https://tzdnlerourmpcsfbdatj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_E8Dx4CDsLUuSr1m0M6rI4g_2Gr-mXqq";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORIES = [
    "Display/boosters", "Singles", "Events", "Sleeves",
    "Playmat", "Storage box", "Bundle", "Other"
  ];
  const GAMES = {
    riftbound: "Riftbound",
    magic: "Magic The Gathering",
    pokemon: "Pokemon",
    lorcana: "Lorcana",
    "one-piece": "One Piece",
    "flesh-and-blood": "Flesh n Blood",
    other: "Other TCGs"
  };
  const CATEGORY_COLORS = {
    "Display/boosters": "#8b5cf6",
    "Singles": "#22b8cf",
    "Events": "#e7bd52",
    "Sleeves": "#4ade80",
    "Playmat": "#fb7a4a",
    "Storage box": "#f472b6",
    "Bundle": "#60a5fa",
    "Other": "#94a3b8"
  };
  const LEGACY_CATEGORIES = {
    "Cartes à l'unité": "Singles",
    "Events/Nexus Nights": "Events",
    "Boîte de rangement": "Storage box",
    "Autre": "Other"
  };
  const MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // ---------- State ----------
  let session = null;
  let expenses = [];       // all expenses for the logged in user, newest first
  let editingId = null;
  let isSignup = false;
  let currentGame = localStorage.getItem("tcg_tracker_game") || "riftbound";
  let statsGame = localStorage.getItem("tcg_tracker_stats_game") || "all";

  // ---------- Helpers ----------
  function fmtCHF(n){
    const v = Number(n) || 0;
    const parts = v.toFixed(2).split(".");
    let intPart = parts[0];
    let neg = intPart.startsWith("-");
    if (neg) intPart = intPart.slice(1);
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, "\u2019");
    return (neg ? "-" : "") + intPart + "." + parts[1] + " CHF";
  }
  function fmtDate(iso){
    const [y,m,d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  function todayISO(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function monthKey(iso){ return iso.slice(0,7); } // YYYY-MM
  function currentMonthKey(){ return monthKey(todayISO()); }
  function monthLabel(key){
    const [y,m] = key.split("-");
    return MONTHS_EN[parseInt(m,10)-1] + " " + y.slice(2);
  }
  function showAuthError(msg){
    const el = document.getElementById("auth-error");
    el.textContent = msg;
    el.style.display = msg ? "block" : "none";
  }
  function translateAuthError(err){
    const m = (err && err.message) || "";
    if (/Invalid login credentials/i.test(m)) return "Invalid email or password.";
    if (/User already registered/i.test(m)) return "An account already exists with this email.";
    if (/Password should be at least/i.test(m)) return "Password must be at least 6 characters.";
    if (/Unable to validate email/i.test(m) || /invalid email/i.test(m)) return "Invalid email address.";
    if (/rate limit/i.test(m)) return "Too many attempts. Please try again shortly.";
    return m || "Something went wrong.";
  }

  function setActiveView(viewId){
    document.querySelectorAll(".view").forEach(view=>{
      view.classList.toggle("active", view.id === viewId);
    });
    document.querySelectorAll("[data-view]").forEach(button=>{
      button.classList.toggle("active", button.dataset.view === viewId);
    });
    if (viewId === "stats-view") renderCharts();
  }

  // ---------- Palette ----------
  const LEGACY_PALETTES = { violet:"chaos", ember:"fury", tide:"calm", gold:"order" };
  function applyPalette(name){
    name = LEGACY_PALETTES[name] || name;
    document.documentElement.setAttribute("data-theme", name);
    document.getElementById("palette-select").value = name;
    localStorage.setItem("tcg_tracker_palette", name);
  }
  document.getElementById("palette-select").addEventListener("change", (e)=>{
    applyPalette(e.target.value);
    renderCharts(); // chart bg/gridlines don't depend on theme colors, but keep in sync if changed later
  });
  const gameSelect = document.getElementById("game-select");
  gameSelect.value = currentGame;
  gameSelect.addEventListener("change", async (e)=>{
    currentGame = e.target.value;
    localStorage.setItem("tcg_tracker_game", currentGame);
    editingId = null;
    await loadBudget();
    renderExpensesList();
    renderBudgetProgress();
  });
  const statsGameFilter = document.getElementById("stats-game-filter");
  statsGameFilter.value = statsGame;
  statsGameFilter.addEventListener("change", (e)=>{
    statsGame = e.target.value;
    localStorage.setItem("tcg_tracker_stats_game", statsGame);
    renderCharts();
  });
  document.querySelectorAll("[data-view]").forEach(button=>{
    button.addEventListener("click", ()=>setActiveView(button.dataset.view));
  });
  applyPalette(localStorage.getItem("tcg_tracker_palette") || localStorage.getItem("riftbound_palette") || "violet");

  // ---------- Category select ----------
  const catSelect = document.getElementById("exp-category");
  CATEGORIES.forEach(c=>{
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });
  document.getElementById("exp-date").value = todayISO();

  // ---------- Auth flow ----------
  const authForm = document.getElementById("auth-form");
  const authTitle = document.getElementById("auth-title");
  const authSubmit = document.getElementById("auth-submit");
  const authToggleBtn = document.getElementById("auth-toggle-btn");
  const authToggleText = document.getElementById("auth-toggle-text");

  authToggleBtn.addEventListener("click", ()=>{
    isSignup = !isSignup;
    showAuthError("");
    if (isSignup){
      authTitle.textContent = "Create an account";
      authSubmit.textContent = "Create account";
      authToggleText.textContent = "Already have an account?";
      authToggleBtn.textContent = "Sign in";
    } else {
      authTitle.textContent = "Sign in";
      authSubmit.textContent = "Sign in";
      authToggleText.textContent = "Don't have an account yet?";
      authToggleBtn.textContent = "Create an account";
    }
  });

  authForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    showAuthError("");
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    authSubmit.disabled = true;
    try{
      if (isSignup){
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch(err){
      showAuthError(translateAuthError(err));
    } finally {
      authSubmit.disabled = false;
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async ()=>{
    await sb.auth.signOut();
  });

  sb.auth.onAuthStateChange((_event, sess)=>{
    session = sess;
    if (session){
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      document.getElementById("user-email").textContent = session.user.email;
      loadAll();
    } else {
      document.getElementById("app-screen").style.display = "none";
      document.getElementById("auth-screen").style.display = "flex";
    }
  });

  // ---------- Data loading ----------
  async function loadAll(){
    await Promise.all([loadExpenses(), loadBudget()]);
  }

  async function loadExpenses(){
    const { data, error } = await sb
      .from("expenses")
      .select("*")
      .order("date", { ascending:false })
      .order("created_at", { ascending:false });
    if (error){ console.error(error); return; }
    expenses = (data || []).map(expense=>({
      ...expense,
      game: expense.game || "riftbound",
      category: LEGACY_CATEGORIES[expense.category] || expense.category
    }));
    renderExpensesList();
    renderBudgetProgress();
    renderCharts();
  }

  async function loadBudget(){
    const key = currentMonthKey();
    const { data, error } = await sb
      .from("budgets")
      .select("*")
      .eq("month", key)
      .eq("game", currentGame)
      .limit(1);
    if (error){ console.error(error); return; }
    const row = (data && data[0]) || null;
    document.getElementById("budget-input").value = row ? row.amount : "";
    document.getElementById("budget-input").dataset.rowId = row ? row.id : "";
    renderBudgetProgress();
  }

  // ---------- Expense CRUD ----------
  document.getElementById("expense-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const category = document.getElementById("exp-category").value;
    const amount = parseFloat(document.getElementById("exp-amount").value);
    const date = document.getElementById("exp-date").value;
    const note = document.getElementById("exp-note").value.trim();
    if (!(amount > 0) || !date) return;

    const { error } = await sb.from("expenses").insert({
      user_id: session.user.id, game: currentGame, category, amount, date, note: note || null
    });
    if (error){ alert("Error adding expense: " + error.message); return; }

    document.getElementById("exp-amount").value = "";
    document.getElementById("exp-note").value = "";
    document.getElementById("exp-date").value = todayISO();
    await loadExpenses();
  });

  async function deleteExpense(id){
    if (!confirm("Delete this expense?")) return;
    const { error } = await sb.from("expenses").delete().eq("id", id);
    if (error){ alert("Error deleting expense: " + error.message); return; }
    await loadExpenses();
  }

  async function saveEditedExpense(id){
    const row = document.querySelector(`[data-row-id="${id}"]`);
    const category = row.querySelector(".edit-category").value;
    const amount = parseFloat(row.querySelector(".edit-amount").value);
    const date = row.querySelector(".edit-date").value;
    const note = row.querySelector(".edit-note").value.trim();
    if (!(amount > 0) || !date) return;
    const { error } = await sb.from("expenses").update({ category, amount, date, note: note || null }).eq("id", id);
    if (error){ alert("Error updating expense: " + error.message); return; }
    editingId = null;
    await loadExpenses();
  }

  // ---------- Budget save ----------
  document.getElementById("budget-save-btn").addEventListener("click", async ()=>{
    const input = document.getElementById("budget-input");
    const amount = parseFloat(input.value);
    if (!(amount >= 0)) return;
    const key = currentMonthKey();
    const rowId = input.dataset.rowId;
    let error;
    if (rowId){
      ({ error } = await sb.from("budgets").update({ amount }).eq("id", rowId));
    } else {
      const res = await sb.from("budgets").insert({ user_id: session.user.id, game: currentGame, month: key, amount }).select().single();
      error = res.error;
      if (!error && res.data) input.dataset.rowId = res.data.id;
    }
    if (error){ alert("Error saving budget: " + error.message); return; }
    renderBudgetProgress();
  });

  // ---------- Rendering: expenses list ----------
  function renderExpensesList(){
    const container = document.getElementById("expenses-list");
    const visibleExpenses = expenses.filter(exp=>exp.game === currentGame);
    document.getElementById("expense-game-label").textContent = " - " + (GAMES[currentGame] || "Other TCGs");
    container.innerHTML = "";
    if (!visibleExpenses.length){
      container.innerHTML = `<div class="empty-state">No expenses recorded yet.</div>`;
      return;
    }
    visibleExpenses.forEach(exp=>{
      const row = document.createElement("div");
      row.className = "expense-row";
      row.setAttribute("data-row-id", exp.id);

      if (editingId === exp.id){
        row.innerHTML = `
          <div>
            <input type="date" class="edit-date" value="${exp.date}">
          </div>
          <div>
            <select class="edit-category"></select>
            <input type="text" class="edit-note" value="${exp.note ? escapeHtml(exp.note) : ""}" placeholder="Note" style="margin-top:6px;">
          </div>
          <div>
            <input type="number" class="edit-amount" step="0.05" min="0" value="${exp.amount}">
          </div>
          <div class="expense-actions">
            <button class="btn-primary btn-sm" data-action="save">OK</button>
            <button class="btn-ghost btn-sm" data-action="cancel">Cancel</button>
          </div>`;
        const sel = row.querySelector(".edit-category");
        CATEGORIES.forEach(c=>{
          const opt = document.createElement("option");
          opt.value = c; opt.textContent = c;
          if (c === exp.category) opt.selected = true;
          sel.appendChild(opt);
        });
        row.querySelector('[data-action="save"]').addEventListener("click", ()=>saveEditedExpense(exp.id));
        row.querySelector('[data-action="cancel"]').addEventListener("click", ()=>{ editingId = null; renderExpensesList(); });
      } else {
        const color = CATEGORY_COLORS[exp.category] || "#94a3b8";
        row.classList.add("expense-row-view");
        row.innerHTML = `
          <div style="color:var(--text-dim); font-size:0.82rem;">${fmtDate(exp.date)}</div>
          <div class="expense-details">
            <div class="expense-cat"><span class="cat-dot" style="background:${color}"></span>${escapeHtml(exp.category)}</div>
            ${exp.note ? `<div class="expense-note">${escapeHtml(exp.note)}</div>` : ""}
            <div class="expense-amount">${fmtCHF(exp.amount)}</div>
          </div>
          <div class="expense-actions">
            <button class="btn-ghost btn-sm" data-action="edit">Edit</button>
            <button class="btn-danger btn-sm" data-action="del">Delete</button>
          </div>`;
        row.querySelector('[data-action="edit"]').addEventListener("click", ()=>{ editingId = exp.id; renderExpensesList(); });
        row.querySelector('[data-action="del"]').addEventListener("click", ()=>deleteExpense(exp.id));
      }
      container.appendChild(row);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  // ---------- Rendering: budget ----------
  function renderBudgetProgress(){
    const key = currentMonthKey();
    const spent = expenses.filter(e=>e.game===currentGame && monthKey(e.date)===key).reduce((s,e)=>s+Number(e.amount),0);
    const budgetVal = parseFloat(document.getElementById("budget-input").value) || 0;
    const pct = budgetVal > 0 ? Math.min((spent/budgetVal)*100, 999) : 0;
    const fill = document.getElementById("budget-progress");
    fill.style.width = Math.min(pct,100) + "%";
    fill.style.background = pct >= 100 ? "var(--danger)" : pct >= 80 ? "var(--warn)" : "var(--accent)";
    document.getElementById("budget-spent-lbl").textContent = fmtCHF(spent) + " spent";
    document.getElementById("budget-pct-lbl").textContent = budgetVal > 0 ? Math.round(pct) + "%" : "—";
    const alertEl = document.getElementById("budget-alert");
    if (budgetVal > 0 && spent > budgetVal){
      alertEl.style.display = "block";
      alertEl.textContent = `Budget exceeded by ${fmtCHF(spent-budgetVal)} this month.`;
    } else {
      alertEl.style.display = "none";
    }
  }

  // ---------- Rendering: charts ----------
  function renderCharts(){
    renderStatSummary();
    renderDonut();
    renderBars();
    renderGameBreakdown();
  }

  function getStatsExpenses(){
    return statsGame === "all" ? expenses : expenses.filter(e=>e.game===statsGame);
  }

  function renderStatSummary(){
    const selectedExpenses = getStatsExpenses();
    const key = currentMonthKey();
    const monthTotal = selectedExpenses.filter(e=>monthKey(e.date)===key).reduce((s,e)=>s+Number(e.amount),0);
    const allTimeTotal = selectedExpenses.reduce((s,e)=>s+Number(e.amount),0);
    document.getElementById("stats-month-total").textContent = fmtCHF(monthTotal);
    document.getElementById("stats-all-time-total").textContent = fmtCHF(allTimeTotal);
    document.getElementById("stats-expense-count").textContent = String(selectedExpenses.length);
  }

  function renderGameBreakdown(){
    const container = document.getElementById("game-breakdown-list");
    const key = currentMonthKey();
    const totals = {};
    expenses.filter(e=>monthKey(e.date)===key).forEach(e=>{
      totals[e.game] = (totals[e.game] || 0) + Number(e.amount);
    });
    const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
    container.innerHTML = "";
    if (!entries.length){
      container.innerHTML = `<div class="empty-state">No expenses this month yet.</div>`;
      return;
    }
    entries.forEach(([game, total])=>{
      const row = document.createElement("div");
      row.className = "game-total-row";
      row.innerHTML = `<span class="cat-dot" style="background:var(--accent)"></span>
        <span class="name">${escapeHtml(GAMES[game] || "Other TCGs")}</span>
        <span class="amount">${fmtCHF(total)}</span>`;
      container.appendChild(row);
    });
  }

  function renderDonut(){
    const canvas = document.getElementById("chart-donut");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const size = Math.min(220, canvas.parentElement.clientWidth || 220);
    canvas.width = size*dpr; canvas.height = size*dpr; canvas.style.width = size+"px"; canvas.style.height = size+"px";
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,size,size);

    const key = currentMonthKey();
    const totals = {};
    let grandTotal = 0;
    getStatsExpenses().filter(e=>monthKey(e.date)===key).forEach(e=>{
      totals[e.category] = (totals[e.category]||0) + Number(e.amount);
      grandTotal += Number(e.amount);
    });

    document.getElementById("donut-total").innerHTML =
      `<div class="num">${fmtCHF(grandTotal)}</div><div class="lbl">${monthLabel(key)}</div>`;

    const legend = document.getElementById("donut-legend");
    legend.innerHTML = "";

    if (grandTotal <= 0){
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2-10, 0, Math.PI*2);
      ctx.strokeStyle = getCss("--border"); ctx.lineWidth = 18; ctx.stroke();
      legend.innerHTML = `<div class="empty-state">No expenses this month yet.</div>`;
      return;
    }

    const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
    let start = -Math.PI/2;
    const cx = size/2, cy = size/2, r = size/2 - 14;
    entries.forEach(([cat, val])=>{
      const frac = val/grandTotal;
      const end = start + frac*Math.PI*2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, start, end);
      ctx.strokeStyle = CATEGORY_COLORS[cat] || "#94a3b8";
      ctx.lineWidth = 26;
      ctx.lineCap = "butt";
      ctx.stroke();
      start = end;

      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="cat-dot" style="background:${CATEGORY_COLORS[cat]||"#94a3b8"}"></span>
        <span class="name">${escapeHtml(cat)}</span>
        <span class="val">${Math.round(frac*100)}% · ${fmtCHF(val)}</span>`;
      legend.appendChild(item);
    });
  }

  function renderBars(){
    const canvas = document.getElementById("chart-bars");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const wrap = canvas.parentElement;
    const w = Math.max(240, wrap.clientWidth || 320);
    const h = 220;
    canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.width = w+"px"; canvas.style.height = h+"px";
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);

    // last 6 months keys, oldest first
    const now = new Date();
    const keys = [];
    for (let i=5; i>=0; i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"));
    }
    const selectedExpenses = getStatsExpenses();
    const totals = keys.map(k=>selectedExpenses.filter(e=>monthKey(e.date)===k).reduce((s,e)=>s+Number(e.amount),0));
    const max = Math.max(...totals, 1);

    const padL = 8, padB = 26, padT = 14, padR = 8;
    const chartW = w - padL - padR, chartH = h - padT - padB;
    const barW = chartW / keys.length * 0.55;
    const gap = chartW / keys.length;

    // gridlines
    ctx.strokeStyle = getCss("--border"); ctx.lineWidth = 1;
    for (let i=0;i<=3;i++){
      const y = padT + chartH - (chartH*i/3);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+chartW, y); ctx.stroke();
    }

    keys.forEach((k, i)=>{
      const val = totals[i];
      const barH = max > 0 ? (val/max)*chartH : 0;
      const x = padL + gap*i + (gap-barW)/2;
      const y = padT + chartH - barH;
      const isCurrent = k === currentMonthKey();
      ctx.fillStyle = isCurrent ? getCss("--accent-strong") : getCss("--accent");
      ctx.globalAlpha = isCurrent ? 1 : 0.55;
      roundRect(ctx, x, y, barW, Math.max(barH,2), 4);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = getCss("--text-dim");
      ctx.font = "11px ui-sans-serif, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(monthLabel(k).split(" ")[0], x + barW/2, h - 8);
    });
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  let resizeTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderCharts, 150);
  });

  // ---------- Boot ----------
  sb.auth.getSession().then(({ data })=>{
    session = data.session;
    if (session){
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      document.getElementById("user-email").textContent = session.user.email;
      loadAll();
    }
  });
})();
</script>
</body>
</html>
